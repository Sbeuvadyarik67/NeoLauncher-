<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Brain Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Переключатель языка -->
        <div class="lang-switch">
            <button id="lang-ru" class="lang-btn active">RU</button>
            <button id="lang-en" class="lang-btn">EN</button>
        </div>

        <h1>🧠 Brain Clicker</h1>

        <!-- Счётчик -->
        <div class="score">
            <span id="score">0</span> <span id="score-label">мозгов</span>
        </div>

        <!-- Кнопка-мозг -->
        <div class="brain-container">
            <button id="brain" class="brain">🧠</button>
        </div>

        <!-- Статистика -->
        <div class="stats">
            <div><span id="clicks-label">Кликов:</span> <span id="clicks">0</span></div>
            <div><span id="psec-label">Мозгов/сек:</span> <span id="per-sec">0</span></div>
        </div>

        <!-- Подсказка про оффлайн -->
        <div class="offline-hint">
            <span id="offline-hint-label">Если уйдёте — я поработаю за вас! 🧠</span>
        </div>

        <!-- Магазин -->
        <div class="shop-wrapper">
            <div id="teaser-container" class="teaser-container"></div>

            <!-- Окно магазина -->
            <div class="shop" id="shop-window">
                <div class="shop-header" id="shop-header">
                    <div class="shop-title">🛒 <span id="shop-label">Магазин</span></div>
                    <button id="shop-close" class="shop-close">✖</button>
                </div>
                <div class="shop-content" id="shop-content">

                    <!-- Товар 1: Сила клика -->
                    <div class="shop-item">
                        <div class="shop-item-info">
                            <span class="shop-item-name">⚡ Сила клика</span>
                            <span class="shop-item-level" id="click-level">Ур. 1</span>
                        </div>
                        <button id="buy-click" class="buy-btn">Купить (10 🧠)</button>
                    </div>

                    <!-- Товар 2: Нейро-сеть -->
                    <div class="shop-item">
                        <div class="shop-item-info">
                            <span class="shop-item-name">🕸️ Нейро-сеть</span>
                            <span class="shop-item-level" id="passive-level">Ур. 0 (0/час)</span>
                        </div>
                        <button id="buy-passive" class="buy-btn">Купить (100 🧠)</button>
                    </div>

                    <!-- Товар 3: Имплант -->
                    <div class="shop-item">
                        <div class="shop-item-info">
                            <span class="shop-item-name">🧬 Нейро-имплант</span>
                            <span class="shop-item-level" id="implant-level">Ур. 0 (+0%)</span>
                        </div>
                        <button id="buy-implant" class="buy-btn">Купить (500 🧠)</button>
                    </div>

                </div> <!-- Закрываем shop-content -->
            </div> <!-- Закрываем shop -->
        </div> <!-- Закрываем shop-wrapper -->

        <!-- Кнопки -->
        <div style="margin-top: 20px;">
            <button id="open-shop-btn" class="reset-btn"
                style="margin-right: 10px; border-color: #ff2d8a; color: #ff2d8a;">🛒 Открыть магазин</button>
            <button id="reset" class="reset-btn"><span id="reset-label">Сбросить прогресс</span></button>
        </div>
    </div>

    <!-- Слой для тени -->
    <div id="shadow-layer" class="shadow-layer"></div>

    <script src="script.js"></script>
</body>

</html>
